# Fork-only (wapp-its/meeting-transcriber); never part of a submission to the
# original (submit.sh blocks .github/workflows/wapp-*).
#
# CI for a fork PR runs once, on request, right before the merge (fork issue #128:
# GitHub paused the fork's workflows over Actions usage when every push ran the full
# suite). A push to a PR starts nothing. Request CI once the head is final, after
# any catch-up merge and bookkeeping commits:
#
#   gh workflow run wapp-fork-ci.yml -R wapp-its/meeting-transcriber -f pr=<number>
#
# The request judges the PR's current head (wapp-fork-ci/fork_ci.py): when it
# differs from a commit whose ci.yml run passed only in .flow/, Markdown or docs/,
# the status `ci (upstream ci.yml)` turns green at once, naming that commit.
# Otherwise it starts the original's ci.yml on the PR branch (on a manual start all
# of ci.yml's jobs run) and leaves the status pending. No runner waits for it:
# wapp-fork-ci-result.yml turns the finished run into the status. A push after the
# request leaves the new head without a status, which means "not tested".
name: wapp fork CI
run-name: "CI request for PR #${{ inputs.pr }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the fork PR into wapp/main"
        required: true
        type: number

permissions:
  actions: write
  statuses: write
  contents: read
  pull-requests: read

concurrency:
  group: wapp-fork-ci-request-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  request:
    name: request ci.yml
    if: github.repository == 'wapp-its/meeting-transcriber'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the head is compared with commits whose ci.yml run passed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Judge the PR head, then start ci.yml or report the skip
        env:
          GH_TOKEN: ${{ github.token }}
          # ci.yml is started with this personal token: GitHub starts no workflow for
          # a run the workflow token started, so wapp-fork-ci-result.yml would not fire.
          DISPATCH_TOKEN: ${{ secrets.WAPP_SYNC_TOKEN }}
          PR: ${{ inputs.pr }}
        run: >-
          python3 .github/workflows/wapp-fork-ci/fork_ci.py request
          --repo "$GITHUB_REPOSITORY" --pr "$PR" --fetch
          --self-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
